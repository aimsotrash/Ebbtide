[project]
name = "ebbtide"
version = "0.3.1"
description = "Ebbtide MCP: local long-term memory for AI agents, with hybrid search and a forgetting curve."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nikhil Pawar" }]
requires-python = ">=3.12"
# Pinned: the versions validated on Python 3.12. ONNX Runtime has wheels for Linux, Windows and
# Apple silicon Macs (macOS 14+).
dependencies = [
    "onnxruntime==1.31.1",
    "tokenizers==0.23.3",
    "numpy==2.4.6",
    "mcp==2.3.0",
]

[project.urls]
Homepage = "https://aimsotrash-ebbtide.vercel.app"
Repository = "https://github.com/aimsotrash/Ebbtide"

[project.scripts]
ebbtide = "ebbtide.server:main"
ebbtide-panel = "ebbtide.panel:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ponytail: `intelligence` ships as its own top-level package; fine in uv's isolated tool
# environments, move it under `ebbtide` if anyone installs this into a shared environment.
packages = ["ebbtide", "intelligence"]
exclude = ["*/tests"]

[tool.hatch.build.targets.sdist]
# The code and its tests, not the site, the benchmarks or the data.
include = ["/ebbtide", "/intelligence", "/README.md", "/LICENSE", "/pyproject.toml"]
