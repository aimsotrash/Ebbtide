name: CI

# Runs on every push/PR to main:
#   - intelligence, MCP server and benchmark pytest  (tests)
#   - pip-audit                                      (Python dependency security)
#   - landing page (site/) lint / test / tsc / build (build validation)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python tests & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 3.12 has wheels for the full ML stack in engram_mcp/requirements.txt,
          # which is validated on 3.12; the tests only need a slice of it.
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Intelligence tests
        run: python -m pytest intelligence/tests/ -v

      - name: MCP server tests
        run: python -m pytest engram_mcp/tests/ -v

      - name: Benchmark harness tests
        run: python -m pytest bench/ -v

      # Dependency vulnerability scan. Non-blocking for now so a transitive
      # advisory surfaces without wedging CI; remove continue-on-error to gate.
      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --strict --desc

  site:
    name: Landing page lint / typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install (lockfile-exact)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck and build
        run: npm run build
