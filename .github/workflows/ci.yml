name: CI

# Runs on every push/PR to main:
#   - intelligence, MCP server and benchmark pytest  (tests)
#   - pip-audit                                      (Python dependency security)
#   - package build                                  (pyproject.toml)
#   - install + real embedding on Linux, Windows, macOS (platform support)
#   - landing page (site/) lint / tsc / build        (build validation)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python tests & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 3.12 has wheels for the full ML stack in pyproject.toml, which is
          # validated on 3.12; the tests only need a slice of it.
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Intelligence tests
        run: python -m pytest intelligence/tests/ -v

      - name: MCP server tests
        run: python -m pytest ebbtide/tests/ -v

      - name: Benchmark harness tests
        run: python -m pytest bench/ -v

      - name: Package builds
        run: pip wheel --no-deps -w dist .

      # Dependency vulnerability scan. Non-blocking for now so a transitive
      # advisory surfaces without wedging CI; remove continue-on-error to gate.
      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --strict --desc

  embed:
    name: Install and embed (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the package
        run: pip install .

      # Outside the checkout, so this is the installed package, not the source tree.
      - name: Embed with the real model, then start and stop the server
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from intelligence.embeddings import embed_query, fits; v = embed_query('I take my coffee black'); assert len(v) == 384 and abs(sum(x * x for x in v) - 1) < 1e-4 and fits('short'); print('embedding ok')"
          ebbtide < /dev/null

  site:
    name: Landing page lint / typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install (lockfile-exact)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build
