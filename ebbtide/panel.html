<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ebbtide memory</title>
<style>
  @font-face { font-family: "Geist"; src: url(/geist.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
  :root {
    color-scheme: light dark;
    --bg: #f2f4f7; --card: #fff; --ink: #111; --muted: #5c6370; --data: #1d5fbf; --rule: #dde1e8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --card: #1f2227; --ink: #ededed; --muted: #9aa1ad; --data: #6f9be8; --rule: #2a2e35; }
  }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.4 "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: clamp(24px, 6vw, 48px) clamp(16px, 4vw, 24px) 48px; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; align-items: center; gap: 8px; }
  .mark { flex: none; color: var(--ink); }
  .mark path { stroke: var(--bg); }
  h1 { margin: 0; font-size: 17px; font-weight: 600; }
  #kept { margin-left: auto; font-size: 13px; }

  .card { margin-top: 20px; padding: 12px 16px; border-radius: 8px; background: var(--card); }
  .card div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; }
  .card label { font-weight: 500; }
  #ahead { display: block; width: 100%; margin: 12px 0 0; accent-color: var(--data); }

  [role="tablist"] { display: flex; gap: 20px; margin-top: 20px; font-size: 13px; border-bottom: 1px solid var(--rule); } /* taste-skill-ignore: underline tabs sit on a 1px rule */
  [role="tab"] {
    margin: 0 0 -1px; padding: 0 0 8px; border: 0; border-bottom: 2px solid transparent;
    background: none; color: var(--muted); font: inherit; font-weight: 500; cursor: pointer;
  }
  [role="tab"]:hover, [role="tab"][aria-selected="true"] { color: var(--ink); }
  [role="tab"][aria-selected="true"] { border-bottom-color: var(--ink); }

  #note { margin: 0; color: var(--muted); }
  #note:not(:empty) { padding: 14px 0 4px; }
  ol { margin: 4px 0 0; padding: 0; list-style: none; }
  li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 12px; padding: 10px 0; }
  .text, .pct { font-size: 15px; }
  .text { overflow-wrap: anywhere; }
  .pct { text-align: right; }
  .meta { display: flex; flex-wrap: wrap; gap: 0 12px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .bar { align-self: start; justify-self: end; width: 56px; height: 4px; margin-top: 7px; overflow: hidden; border-radius: 2px; background: var(--rule); }  /* centred on the first 13px/1.4 meta line */
  .bar span { display: block; height: 100%; background: var(--data); }
  footer { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    [role="tab"] { transition: color .15s, border-color .15s; }
  }
</style>
</head>
<body>
<main>
  <header>
    <svg class="mark" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="currentColor"/>
      <path d="M7 8.5C11.5 8.5 13.5 21 25.5 22.5" fill="none" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <h1>Memories</h1>
    <span id="kept" class="muted num"></span>
  </header>

  <div class="card">
    <div>
      <label for="ahead">Look ahead</label>
      <output id="ahead-value" class="muted num" for="ahead">today</output>
    </div>
    <input id="ahead" type="range" min="0" max="60" step="1" value="0" aria-valuetext="today">
  </div>

  <div role="tablist" aria-label="Which memories">
    <button id="tab-all" role="tab" aria-selected="true" aria-controls="panel" data-tab="all">All</button>
    <button id="tab-fading" role="tab" aria-selected="false" aria-controls="panel" data-tab="fading" tabindex="-1">Fading</button>
  </div>
  <div id="panel" role="tabpanel" aria-labelledby="tab-all" tabindex="0">
    <p id="note" role="status"></p>
    <ol id="list"></ol>
  </div>

  <footer class="num" aria-live="polite"><span id="budget"></span><span id="policy"></span><span id="mean"></span></footer>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const ahead = $("ahead"), list = $("list"), note = $("note"), panel = $("panel");
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  const EMPTY = "No memories yet. Ask your agent to remember something.";
  const NONE_FADING = "No memory is under 50%.";
  const DOWN = "Can't reach the panel server. Is ebbtide-panel running?";
  const num = (n) => n.toLocaleString("en-US");
  const pct = (m) => Math.round(100 * m.strength);
  const put = (el, text) => { if (el.textContent !== text) el.textContent = text; };  // a live region repeats every write
  let tab = "all", data = null, last = "", down = false, seq = 0;

  function span(text, className = "") {
    return Object.assign(document.createElement("span"), {className, textContent: text});  // agent-written text: never parsed as HTML
  }

  function row(m, goesFirst) {
    const meta = span("", "meta");
    meta.append(span(`id ${m.id}`), ...m.tags.map((t) => span(`#${t}`)), span(`recalled ${m.recalls}×`),
                span(`half-life ${m.half_life_days.toFixed(1)} d`), ...(goesFirst ? [span("goes first")] : []));
    const bar = span("", "bar");
    bar.setAttribute("aria-hidden", "true");
    bar.append(span(""));
    bar.firstChild.style.width = `${pct(m)}%`;
    const li = document.createElement("li");
    li.append(span(m.text, "text"), span(`${pct(m)}%`, "pct num"), meta, bar);
    return li;
  }

  function render() {
    for (const t of tabs) {
      t.setAttribute("aria-selected", t.dataset.tab === tab);
      t.tabIndex = t.dataset.tab === tab ? 0 : -1;
    }
    panel.setAttribute("aria-labelledby", `tab-${tab}`);
    if (!data) return;
    const all = data.memories, n = all.length, fading = all.filter((m) => pct(m) < 50);
    const shown = tab === "all" ? all : fading;
    put($("kept"), data.budget === null ? `${num(n)} kept` : `${num(n)} kept of ${num(data.budget)}`);
    put(tabs[0], `All ${num(n)}`);
    put(tabs[1], `Fading ${num(fading.length)}`);
    // ponytail: rebuilds every row on each change, which drops a text selection; key rows by id if that bites.
    list.replaceChildren(...shown.map((m) => row(m, m.id === data.goes_first)));  // the server names it
    put(note, down ? DOWN : !n ? EMPTY : shown.length ? "" : NONE_FADING);
    put($("budget"), `budget ${data.budget === null ? "none" : num(data.budget)}`);
    put($("policy"), `policy ${data.policy}`);
    put($("mean"), n ? `mean strength ${Math.round(100 * all.reduce((sum, m) => sum + m.strength, 0) / n)}%` : "");
  }

  async function refresh() {
    const days = Number(ahead.value), mine = ++seq;
    const when = days ? `in ${days} day${days === 1 ? "" : "s"}` : "today";
    put($("ahead-value"), when);
    ahead.setAttribute("aria-valuetext", when);
    try {
      const text = await (await fetch(`/memories?ahead=${days}`)).text();
      if (mine !== seq || (text === last && !down)) return;  // a newer request is out, or nothing changed
      data = JSON.parse(text);
      last = text;
      down = false;
      render();
    } catch {
      if (mine !== seq) return;
      down = true;
      put(note, DOWN);
    }
  }

  for (const t of tabs) t.addEventListener("click", () => { tab = t.dataset.tab; render(); });
  document.querySelector('[role="tablist"]').addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const other = tabs.find((t) => t.dataset.tab !== tab);
    other.click();
    other.focus();
  });
  ahead.addEventListener("input", refresh);
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
